name: Validate Cloud Deployment Plan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate deployment configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run security validation script
        run: bash scripts/validate-deployment.sh

      - name: Complete
        run: |
          echo "Deployment plan passed validation."
          echo "No Azure resources were created by this workflow."
